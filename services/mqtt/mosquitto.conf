# The device's MQTT broker (Mosquitto), the default broker of the Eye and the voice sample. It publishes
# no port, so only the device's containers reach it, and anonymous access is acceptable there. When
# MQTT_URL in config/percept.env names another broker, this one isn't started.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
