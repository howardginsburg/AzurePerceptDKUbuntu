# Grafana loads the kit's dashboards from /etc/grafana/dashboards (services/dashboard/grafana/dashboards,
# read-only), and re-reads them every minute. Changes made in Grafana can't be saved over them: use
# "Save as" for your own copy, or edit the JSON in the repository and deploy.
apiVersion: 1
providers:
  - name: percept-kit
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
