# Grafana's data source: the dashboard's Prometheus, on the Docker network "percept".
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      prometheusType: Prometheus
